name: Create JARVIS source release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          git archive --format=zip --prefix=JARVIS-Study-Companion/ HEAD > JARVIS-Study-Companion-source.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: JARVIS-Study-Companion-source.zip
